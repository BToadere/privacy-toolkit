name: Release

# Push a tag like v1.0.0 to publish one zip per tool.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Package tools
        run: |
          mkdir dist
          (cd instagram && zip -r ../dist/instagram-activity-cleaner.zip activity-cleaner -x 'activity-cleaner/src/*')
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
